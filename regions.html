  <meta name="description" content="Explore the diverse craft regions of Peru">

  <meta property="og:title" content="Peruvian Regions">
  <meta property="og:description" content="Showing the diverse craft regions of Peru.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="icon" href="public/images/favicon.ico">
</head>

<body>
  <header id="main-header"></header>

  <main>
    <h2>Craft Styles by Region</h2>
    <div class="card-grid">
      <div class="card">
        <img src="public/images/region-highlands.webp" alt="Highlands" width="300">
        <h4>Andean Highlands</h4>
        <p>Renowned for colorful woven textiles, alpaca wool, and intricate embroidery.</p>
      </div>
      <div class="card">
        <img src="public/images/region-coast.webp" alt="Coastal ceramics">
        <h4>Coastal Region</h4>
        <p>Famous for pottery, fine ceramics, and ancient Moche-inspired designs.</p>
      </div>
      <div class="card">
        <img src="public/images/region-amazon.webp" alt="Amazon crafts">
        <h4>Amazon Jungle</h4>
        <p>Art from natural fibers, seeds, and traditional dyes from the rainforest.</p>
      </div>
    </div>
  </main>

 <footer id="main-footer"></footer>

  <script type="module" src="js/main.js"></script>
