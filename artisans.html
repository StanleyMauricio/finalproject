<body>

    <h2>Featured Artisans</h2>
    <div class="card-grid">
      <div class="card">
        <img src="public/images/artisan1.webp" alt="Artisan">
        <h4>Rogelio Quispe</h4>
        <p>Master weaver from Cusco preserving Inca textile traditions.</p>
      </div>
      <div class="card">
        <img src="public/images/artisan2.webp" alt="Artisan">
        <h4>Roberto Mamani</h4>
        <p>Renowned ceramicist blending ancient Moche styles with modern design.</p>
      </div>
      <div class="card">
        <img src="public/images/artisan3.webp" alt="Artisan" width="400">
        <h4>Rosa Shahuano, Maria Ramon, Carla Cordova</h4>
        <p>Amazonian craftswomen creating jewelry from seeds and plant fibers.</p>
      </div>
    </div>
